# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "PT-BR" branch
  push:
    branches: [ "PT-BR" ]
  pull_request:
    branches: [ "PT-BR" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Send dispatch event
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.AUTOMATION_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/usuario/automation-repo/dispatches \
            -d '{"event_type":"curriculum-updated"}'
